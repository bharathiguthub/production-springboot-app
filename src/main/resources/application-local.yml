spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:production_app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    show-sql: true

  # Local-only sample data (db/seed-local) on top of the schema migrations. Never add this location
  # to any other profile.
  flyway:
    locations: classpath:db/migration,classpath:db/seed-local

# DEVELOPMENT-ONLY defaults, used only when the 'local' profile is active and the
# corresponding environment variable is not set. Never reuse these values outside
# local development; production must always supply these externally.
security:
  jwt:
    secret: ${JWT_SECRET:Bj8TIOLZJ9r+t/kHyrXBTaFlFzbZvT07xH8JAr7oT4M=}
  auth:
    username: ${APP_USERNAME:devuser}
    password: ${APP_PASSWORD:devpassword-local-only}

logging:
  level:
    com.example.productionapp: DEBUG
    org.hibernate.SQL: DEBUG
